<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Black goese bistro | pizza-on-Demand</h1>
    <p>
        our 12&quet; wood-fired pizzas are available for delivery 
    </p>

    <form action="hasil.html" method="get">
    
        <fieldset border="1" >
            <p> 
            <legend>your information
            </legend>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">
            </p>

            <p>

                <label for="address"> address: </label>
                <input type="text" id="address" name="address">
            </p>

            <p>
                <label for="phone">phone: </label>
                <input type="tel" id="phone" name="phone">
            </p>

            <p>
                <label for="email"> Email: </label>
                <input type="email" id="email" name="email">
            </p>

            <p>
                <label for="intructions"> delivery intructions:</
                label><br>
                <textarea 
                id="intructions"
                name="intructions"
                rows="4"
                cols="50"
                maxlength="400"
                placeholder="no more than 400 characters.">
            </textarea>
            </p>
        </fieldset>

        <fieldset>
            <lagend>design your dream pizza</lagend>
            <p>pizza specs</p>
            <p>pilih 1:</p>

            <p>

                <input type="radio" id="classic" name="crust"
                value="classic" required>
                <label for="classic">classic</label><br>

                <input type="radio" id="multigrain" name="crust"
                value="multigrain" required>
                <label for="multigrain">multigrain</label><br>

                <input type="radio" id="cheese" name="crust"
                value="cheese" checked required>
                <label for="cheese">cheese</label><br>

                <input type="radio" id="gluten" name="crust"
                value="gluten" required>
                <label for="gluten">gluten</label><br>
            </p>

            <p>toping</p>

            <p>
                <input type="checkbox" id="redsauce"
                name="toppings" value="Red sauce" checked>
                <label for="redsauce">Red sauce</label><br>

                <input type="checkbox" id="whicesauce"
                name="toppings" value="whicesauce">
                <label for="whicesauce">whicesauce</label><br>

                <input type="checkbox" id="mozzarella cheese"
                name="toppings" value="mozzarella cheese" checked>
                <label for="mozzarella cheese">mozzarella cheese</label><br>

                <input type="checkbox" id="peppres"
                name="toppings" value="peppres" checked>
                <label for="peppres">peppres</label><br>

                <input type="checkbox" id="pepperoni"
                name="toppings" value="pepperoni">
                <label for="pepperoni">pepperoni</label><br>

                <input type="checkbox" id="mushrooms"
                name="toppings" value="mushrooms">
                <label for="mushrooms">mushrooms</label><br>

                <input type="checkbox" id="anchovies"
                name="toppings" value="anchovies" checked>
                <label for="anchovies">anchovies</label><br>

            </p>
                Number<br>
                How many pizzas:
                <select name="number">
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                    <option>6</option>
                </select>

                 </fieldset>
            <p>
                <label for="quantity">quantity: </label>
                <input type="number" id="quantity"
                name="quantity" min="1" max="10">
            </p>
        </fieldset>
        <p>
            <button type="submit">Bring me a pizza!</button>
            <button type="reset">Reset</button>
        </p>
    </from>
</body>
</html>
